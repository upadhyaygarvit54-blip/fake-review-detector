<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fake Review Detector</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            width:800px;
            border-radius:20px;
            padding:30px;
            box-shadow:0 0 20px rgba(255,255,255,0.2);
        }

        h1{
            color:#0d6efd;
            font-weight:bold;
        }

        textarea{
            resize:none;
        }

        .result{
            font-size:25px;
            font-weight:bold;
        }

        .score{
            color:green;
            font-size:20px;
        }

    </style>
</head>

<body>

<div class="card bg-light">

    <h1 class="text-center mb-4">
        🔍 Smart Fake Review Detector
    </h1>

    <form action="/predict" method="POST">

        <div class="mb-3">

            <label class="form-label">
                Enter Review
            </label>

            <textarea
            class="form-control"
            rows="6"
            name="review"
            placeholder="Type your review here..."
            required></textarea>

        </div>

        <div class="d-grid">

            <button class="btn btn-primary btn-lg">
                Analyze Review
            </button>

        </div>

    </form>

 {% if prediction %}

    <hr>

    <div class="text-center">

        <h2 style="color:red;">
            {{ prediction }}
        </h2>

        <h4 style="color:green;">
            Confidence Score : {{ confidence }} %
        </h4>

        <h4>
            Sentiment : {{ sentiment }}
        </h4>

        <h4>
            Suspicious Words Found
        </h4>

        {% for word in words %}

        <span class="badge bg-danger">
            {{ word }}
        </span>

        {% endfor %}

    </div>

    {% endif %}

</div>

</body>
</html>
